<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Carla ❤️</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #fff0f3;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Background Layer */
        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .floating-img {
            position: absolute;
            bottom: -250px;
            width: 180px; /* Slightly larger for better visibility */
            height: auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 5px solid white;
            opacity: 0;
            z-index: 2;
            animation: floatUp 12s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-130vh) rotate(15deg); opacity: 0; }
        }

        /* The Question Card */
        .card {
            position: relative;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 400px;
        }

        h1 { color: #ff4d6d; margin-bottom: 30px; font-size: 2rem; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #yesBtn:hover { transform: scale(1.1); background-color: #ff758f; }

        #noBtn { 
            background-color: #adb5bd; 
            color: white; 
            position: absolute; 
        }
    </style>
</head>
<body>

    <div class="photo-container" id="background"></div>

    <div class="card" id="mainCard">
        <h1>Carla, will you be my Valentine?</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <script>
        // 1. Create Floating Photos
        const bg = document.getElementById('background');
        const photoCount = 10; 
        
        for(let i = 1; i <= photoCount; i++) {
            let img = document.createElement('img');
            img.src = `images/${i}.jpeg`;
            img.className = 'floating-img';
            
            // Random horizontal position
            img.style.left = (Math.random() * 80 + 5) + '%';
            // Staggered start times
            img.style.animationDelay = (Math.random() * 20) + 's';
            // Slightly varied speeds
            img.style.animationDuration = (Math.random() * 4 + 10) + 's';

            img.onerror = function() { this.remove(); };
            bg.appendChild(img);
        }

        // 2. The Elusive "No" Button
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            // Move it relative to the whole screen so it "escapes" the card
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // 3. The "Yes" Celebration
        function celebrate() {
            document.getElementById('mainCard').innerHTML = `
                <h1 style="font-size: 3rem;">❤️ Yay! ❤️</h1>
                <p>Can't wait for our Valentine's date on Saturday!</p>
                <p>Even though we're apart, we make it work like always! </p>
                <p>My heart is yours always! <br><strong>- Your Forever Valentine</strong></p>
                <div style="font-size: 50px;">🎉🥰🥂</div>
            `;
            // Optional: Add confetti code here!
        }
    </script>
</body>
</html>
