<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Carla ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Floating Background Photos */
        .photo-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .floating-img {
            position: absolute;
            bottom: -150px;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            opacity: 0.6;
            animation: float Up 15s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* The Main Card */
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
        }

        h1 { color: #ff4d6d; }

        .btn-container {
            margin-top: 30px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn { background-color: #ff4d6d; color: white; margin-right: 20px; }
        #noBtn { background-color: #ffb3c1; color: white; position: absolute; }
    </style>
</head>
<body>

    <div class="photo-container" id="background"></div>

    <div class="card" id="mainCard">
        <h1>Carla, will you be my Valentine?</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <script>
        // 1. Create Floating Photos
        const bg = document.getElementById('background');
        const photoCount = 10; 
        
        for(let i = 1; i <= photoCount; i++) {
            let img = document.createElement('img');
            img.src = `./images/${i}.jpg`; // Make sure your images are named 1.jpg to 10.jpg
            img.className = 'floating-img';
            img.style.left = Math.random() * 90 + '%';
            img.style.animationDelay = Math.random() * 10 + 's';
            img.style.animationDuration = (Math.random() * 10 + 10) + 's';
            bg.appendChild(img);
        }

        // 2. The Elusive "No" Button
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            // Move it relative to the whole screen so it "escapes" the card
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // 3. The "Yes" Celebration
        function celebrate() {
            document.getElementById('mainCard').innerHTML = `
                <h1 style="font-size: 3rem;">❤️ Yay! ❤️</h1>
                <p>Can't wait for our Valentine's date!</p>
                <div style="font-size: 50px;">🎉🥰🥂</div>
            `;
            // Optional: Add confetti code here!
        }
    </script>
</body>
</html>
